name: CI Develop

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  Build:
    name: Build Test (x86_64)
    runs-on: ubuntu-latest
    container:
      image: vladkosten/embedded_env:latest
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -B build -DMATRIX_KBD_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build
      - name: Upload test binary
        uses: actions/upload-artifact@v5
        with:
          name: test-binary
          path: ./build/test/test_runner/MatrixKbdUnitTestRun

  CppCheck:
    name: CppCheck
    needs: Build
    runs-on: ubuntu-latest
    container:
      image: vladkosten/embedded_env:latest
    steps:
      - uses: actions/checkout@v5
      - name: Run CppCheck
        run: |
          mkdir -p reports
          cppcheck --enable=warning,performance,portability \
                   --inconclusive \
                   --language=c \
                   --std=c11 \
                   --template="[{severity}][{id}] {message} {callstack}" \
                   --suppress=ConfigurationNotChecked \
                   --suppress=unreachableCode \
                   --error-exitcode=1 \
                   --inline-suppr \
                   --output-file=reports/cppcheck.txt \
                   main/ portable/
          cat reports/cppcheck.txt
      - name: Upload CppCheck report
        uses: actions/upload-artifact@v5
        with:
          name: cppcheck-report
          path: ./reports/cppcheck.txt

  Misra:
    name: MISRA
    needs: Build
    runs-on: ubuntu-latest
    container:
      image: vladkosten/embedded_env:latest
    steps:
      - uses: actions/checkout@v5
      - name: Run MISRA
        run: |
          mkdir -p reports
          cppcheck --enable=style \
                   --inconclusive \
                   --language=c \
                   --std=c11 \
                   --addon=misra.py \
                   --template="[{severity}][{id}] {message} {callstack}" \
                   --suppress=variableScope \
                   --suppress=unreadVariable \
                   --suppress=unreachableCode \
                   --output-file=reports/misra.txt \
                   main/ portable/
          cat reports/misra.txt
      - name: Upload MISRA report
        uses: actions/upload-artifact@v5
        with:
          name: misra-report
          path: ./reports/misra.txt

  ClangFormat:
    name: Clang Format
    needs: Build
    runs-on: ubuntu-latest
    container:
      image: vladkosten/embedded_env:latest
    steps:
      - uses: actions/checkout@v5
      - name: Run clang-format
        run: |
          find main/ portable/ -name '*.c' -o -name '*.h' | \
            grep -v 'mocks\.' | \
            xargs clang-format --dry-run --Werror

  Test:
    name: Unit Test
    needs:
      - CppCheck
      - Misra
      - ClangFormat
    runs-on: ubuntu-latest
    steps:
      - name: Download test binary
        uses: actions/download-artifact@v5
        with:
          name: test-binary
          path: ./
      - name: Run tests
        run: |
          chmod +x ./MatrixKbdUnitTestRun
          ./MatrixKbdUnitTestRun -v

  Metrics:
    name: Metrics
    needs: Test
    runs-on: ubuntu-latest
    container:
      image: vladkosten/embedded_env:latest
    steps:
      - uses: actions/checkout@v5
      - name: Run Lizard
        run: |
          pip install lizard
          mkdir -p metrics
          lizard main/ portable/ --exclude 'portable/hal/cmock/mocks.c' --xml > metrics/lizard.xml
          lizard main/ portable/ --exclude 'portable/hal/cmock/mocks.c' --csv > metrics/lizard.csv
          lizard main/ portable/ --exclude 'portable/hal/cmock/mocks.c' -C 15 -L 100 -a 5 -i 3 > metrics/lizard_warnings.txt 2>&1 || true
          lizard main/ portable/ --exclude 'portable/hal/cmock/mocks.c' > metrics/lizard_full.txt
          cat metrics/lizard_warnings.txt
      - name: Upload metrics
        uses: actions/upload-artifact@v5
        with:
          name: metrics
          path: ./metrics/
